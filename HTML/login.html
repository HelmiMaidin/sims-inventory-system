<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMS | Login</title>

  <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>
  <main class="login-page">
    <section class="login-card">
      <div class="logo">
        <div class="logo-icon">▦</div>

        <div>
          <h1>SIMS</h1>
          <span>Inventory System</span>
        </div>
      </div>

      <div class="heading">
        <p class="page-kicker">SECURE SYSTEM ACCESS</p>
        <h2>Welcome Back</h2>
        <p>Sign in to access the inventory management system.</p>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>

          <input
            id="username"
            type="text"
            placeholder="Enter your username"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <div class="password-box">
            <input
              id="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              id="showPasswordButton"
              type="button"
              aria-label="Show password"
            >
              Show
            </button>
          </div>
        </div>

        <p id="errorMessage" class="message" aria-live="polite"></p>

        <button id="loginButton" type="submit" class="login-button">
          Login
        </button>
      </form>

      <div class="system-note">
        <span class="online-dot"></span>
        Secure online inventory system
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../JAVASCRIPT/login.js"></script>
</body>
</html>
